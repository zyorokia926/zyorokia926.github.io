<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>スイス全国鉄道路線図</title>
<style>
:root{
  --bg:#f7f6f3;
  --panel-bg:#ffffff;
  --panel-border:#dedad2;
  --text:#1d1d1b;
  --text-dim:#6b6a66;
  --accent:#eb0000;
  --track-main:#c8102e;
  --track-regional:#2e7d32;
  --track-sbahn:#1565c0;
  --track-mountain:#e65100;
  --station-major:#1d1d1b;
  --station-minor:#5a5955;
  --shadow:0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#161513;
    --panel-bg:#211f1c;
    --panel-border:#3a3733;
    --text:#f3f1ec;
    --text-dim:#a6a29a;
    --station-major:#f3f1ec;
    --station-minor:#c9c5bc;
    --shadow:0 2px 14px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--text);
  overflow:hidden;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* ---------- toolbar ---------- */
#toolbar{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:10px 12px 8px;
  background:var(--bg);
  border-bottom:1px solid var(--panel-border);
  z-index:30;
}
#searchRow{display:flex;gap:8px;position:relative;}
#searchInput{
  flex:1 1 auto;
  min-width:0;
  font-size:16px;
  padding:10px 12px;
  border:1.5px solid var(--panel-border);
  border-radius:6px;
  background:var(--panel-bg);
  color:var(--text);
}
#searchInput:focus{outline:2px solid var(--accent);outline-offset:1px;}
#searchBtn{
  flex:0 0 auto;
  font-size:15px;
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
  font-weight:600;
}
#searchBtn:active{opacity:.85;}
#suggestions{
  position:absolute;
  top:calc(100% + 4px);
  left:0;
  right:64px;
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:6px;
  box-shadow:var(--shadow);
  max-height:340px;
  overflow-y:auto;
  z-index:40;
  display:none;
}
#suggestions.show{display:block;}
.sugg-item{
  padding:8px 12px;
  cursor:pointer;
  border-bottom:1px solid var(--panel-border);
  display:flex;
  flex-direction:column;
  gap:1px;
}
.sugg-item:last-child{border-bottom:none;}
.sugg-item:hover,.sugg-item.active{background:rgba(235,0,0,.08);}
.sugg-local{font-weight:600;font-size:14px;}
.sugg-ja{font-size:12.5px;color:var(--text-dim);}
.sugg-region{font-size:11px;color:var(--text-dim);}
.sugg-empty{padding:10px 12px;color:var(--text-dim);font-size:13.5px;}

#regionTabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
}
#regionTabs::-webkit-scrollbar{height:4px;}
.region-btn{
  flex:0 0 auto;
  font-size:12.5px;
  padding:6px 11px;
  border-radius:16px;
  border:1.3px solid var(--panel-border);
  background:var(--panel-bg);
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
}
.region-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}

/* ---------- map area ---------- */
#mapWrap{flex:1 1 auto;position:relative;min-height:0;}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:transparent;}
#map.dragging{cursor:grabbing;}

text{font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;user-select:none;}
.label-local{font-size:9.5px;font-weight:700;fill:var(--text);}
.label-ja{font-size:8px;fill:var(--text-dim);}
.label-group{cursor:pointer;}
.leader{stroke:#1976d2;stroke-width:1.8;opacity:.95;stroke-linecap:round;vector-effect:non-scaling-stroke;}

.station-dot{cursor:pointer;stroke:var(--bg);stroke-width:1;}
.station-dot.major{fill:var(--station-major);}
.station-dot.minor{fill:var(--station-minor);}
.station-dot.mountain{fill:var(--track-mountain);}
.station-dot:hover{stroke:var(--accent);stroke-width:2;}

.track{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
.track-casing{fill:none;stroke:var(--bg);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
/* 路線種別ごとに「色」だけでなく「線の模様」も変えることで、他の路線や文字と重なっても判別できるようにする */
.track.mainline{stroke:var(--track-main);stroke-width:4.6;}                              /* 実線・太め = 主要鉄道 */
.track.regional{stroke:var(--track-regional);stroke-width:3.6;stroke-dasharray:11 6;}    /* 破線 = 地方鉄道 */
.track.sbahn{stroke:var(--track-sbahn);stroke-width:4;stroke-dasharray:.1 8;stroke-linecap:round;} /* 丸ドット = S-Bahn */
.track.mountain{stroke:var(--track-mountain);stroke-width:3.6;stroke-dasharray:10 3 2 3;} /* 一点鎖線 = 山岳鉄道 */
.track.rack{stroke-dasharray:none;}
.rack-tick{fill:none;stroke-linecap:butt;vector-effect:non-scaling-stroke;pointer-events:none;}
.rack-tick.tick-a{stroke:#000;stroke-width:5.2;stroke-dasharray:2.6 6.6;}
.rack-tick.tick-b{stroke:#fff;stroke-width:5.2;stroke-dasharray:2.6 6.6;stroke-dashoffset:4.6;}
.track.scenic-overlay{stroke:#7b1fa2;stroke-width:1.8;stroke-dasharray:.1 5.5;stroke-linecap:round;opacity:.9;pointer-events:none;}
/* ラベル文字に背景色のフチ（ハロー）を付け、線や他の文字と重なっても読めるようにする */
.label-local,.label-ja{
  paint-order:stroke fill;
  stroke:var(--bg);
  stroke-width:3.2px;
  stroke-linejoin:round;
}

.geo-lake{fill:#8fb4c9;opacity:.16;stroke:none;}
.geo-mtn{fill:none;stroke:var(--text-dim);stroke-width:.6;opacity:.18;}
.geo-city-halo{fill:var(--text-dim);opacity:.06;}
.border-arrow-text{font-size:7.5px;fill:var(--text-dim);font-style:italic;}

#highlightLayer circle{fill:none;stroke:var(--accent);stroke-width:2;}
.pulse{animation:pulse 1.4s ease-out infinite;}
@keyframes pulse{
  0%{r:6;opacity:.9;}
  100%{r:22;opacity:0;}
}

/* ---------- floating panels ---------- */
.floating-panel{
  position:absolute;
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:8px;
  box-shadow:var(--shadow);
  font-size:12.5px;
  color:var(--text);
}
#legend{
  top:10px;
  right:10px;
  padding:8px 12px;
  max-width:150px;
  line-height:1.6;
}
.legend-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.legend-swatch{width:18px;height:3px;border-radius:2px;flex:0 0 auto;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}

#layerToggle{
  top:10px;
  left:10px;
  padding:8px 10px;
}
details.floating-panel summary{cursor:pointer;font-weight:600;font-size:12.5px;list-style:none;}
details.floating-panel summary::-webkit-details-marker{display:none;}
details.floating-panel[open] summary::after{content:" ▲";}
details.floating-panel:not([open]) summary::after{content:" ▼";}
#legend summary{margin:0;}
#legend[open] #legendRows{margin-top:8px;}
.layer-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;}
.layer-row label{cursor:pointer;}

#infoPanel{
  bottom:10px;
  left:10px;
  right:10px;
  max-width:340px;
  padding:14px 16px;
  display:none;
}
#infoPanel.show{display:block;}
#infoPanel h3{margin:0 0 2px;font-size:16px;}
#infoPanel .ja-name{color:var(--text-dim);font-size:13px;margin-bottom:8px;}
#infoPanel .info-row{font-size:12.5px;margin:4px 0;}
#infoPanel .info-label{color:var(--text-dim);}
#infoPanel .lines-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.line-chip{font-size:10.5px;padding:2px 7px;border-radius:10px;color:#fff;}
#infoPanel .btn-row{margin-top:10px;display:flex;gap:8px;}
#infoPanel button{
  font-size:12.5px;
  padding:6px 10px;
  border-radius:5px;
  border:1px solid var(--panel-border);
  background:var(--bg);
  color:var(--text);
  cursor:pointer;
}
#infoPanel button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
#infoPanel button.secondary{background:var(--panel-bg);}
.station-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.station-link-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;max-height:112px;overflow:auto;}
.station-link-btn,.tourist-link-btn{font-size:11px;padding:4px 7px;border:1px solid var(--panel-border);border-radius:12px;background:var(--bg);color:var(--text);cursor:pointer;}
.station-link-btn:hover,.tourist-link-btn:hover{border-color:var(--accent);}
#routePanel{bottom:10px;right:10px;width:min(360px,calc(100% - 20px));padding:12px 14px;display:none;z-index:20;}
#routePanel.show{display:block;}
#routePanel h3{margin:0 0 5px;font-size:15px;}
.route-sub{font-size:11.5px;color:var(--text-dim);margin-bottom:7px;}
#routeList{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto;}
.route-item{display:flex;align-items:center;gap:7px;padding:6px 7px;border:1px solid var(--panel-border);border-radius:6px;background:var(--bg);}
.route-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:0 0 auto;}
.route-name{min-width:0;flex:1;}
.route-local{font-weight:600;font-size:12px;}
.route-ja{font-size:10.5px;color:var(--text-dim);}
.route-remove{border:none;background:none;color:var(--text-dim);cursor:pointer;font-size:14px;}
.route-actions{display:flex;gap:6px;margin-top:8px;}
.route-actions button{font-size:11.5px;padding:6px 8px;border:1px solid var(--panel-border);border-radius:5px;background:var(--bg);color:var(--text);cursor:pointer;}
.route-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
#routeSummary{margin-top:7px;font-size:11.5px;line-height:1.45;color:var(--text-dim);}
.tourist-badge{font-size:10px;color:#fff;background:#7b1fa2;border-radius:10px;padding:2px 6px;}
.tourist-dot{fill:#7b1fa2;stroke:var(--bg);stroke-width:1.5;}
#touristLayer{pointer-events:none;}
#routeLayer{pointer-events:none;}
.route-path{fill:none;stroke:#ff1744;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 7;vector-effect:non-scaling-stroke;opacity:.9;paint-order:stroke;}
.route-node{fill:#ff1744;stroke:var(--bg);stroke-width:2;vector-effect:non-scaling-stroke;}
@media (max-width:640px){#routePanel{bottom:10px;right:10px;left:10px;width:auto;max-height:46vh;overflow:auto;}}
#closeInfo{position:absolute;top:6px;right:8px;background:none;border:none;font-size:16px;color:var(--text-dim);cursor:pointer;padding:4px;}

#toast{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:8px;
  padding:10px 18px;
  font-size:13.5px;
  box-shadow:var(--shadow);
  display:none;
  z-index:50;
}
#toast.show{display:block;}

#zoomCtrl{
  position:absolute;
  bottom:10px;
  right:10px;
  display:flex;
  flex-direction:column;
  gap:1px;
}
#zoomCtrl button{
  width:34px;height:34px;
  font-size:18px;
  border:1px solid var(--panel-border);
  background:var(--panel-bg);
  color:var(--text);
  cursor:pointer;
}
#zoomCtrl button:first-child{border-radius:8px 8px 0 0;}
#zoomCtrl button:last-child{border-radius:0 0 8px 8px;}

@media (max-width:640px){
  #legend{max-width:120px;font-size:11px;padding:7px 9px;}
  #infoPanel{right:10px;left:10px;max-width:none;}
  .label-local{font-size:11px;}
  .label-ja{font-size:9.5px;}
}

/* ===== Swiss official boundary map styling ===== */
#baseMap{opacity:.68;filter:brightness(1.10) saturate(.88) contrast(.96);pointer-events:none;}
#map{shape-rendering:optimizeSpeed;text-rendering:optimizeSpeed;}
#geoLayer,#baseMap{pointer-events:none;}
#lineLayer,#labelLayer,#highlightLayer{pointer-events:none;}
#stationLayer{pointer-events:auto;}
#swissBorder{pointer-events:none;paint-order:stroke fill;}
#swissBorder{fill:none;stroke:#222;stroke-width:8;vector-effect:non-scaling-stroke;pointer-events:none;}
#mapStatus{font-size:11px;opacity:.72;margin-left:8px;}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="searchRow">
      <input id="searchInput" type="text" placeholder="駅名を検索（日本語 / 現地語） 例: チューリッヒ, Zermatt" autocomplete="off">
      <button id="searchBtn">検索</button>
      <div id="suggestions"></div>
    </div>
    <div id="regionTabs"></div>
    <button id="routeToggle" class="region-btn" style="align-self:flex-start">🧳 旅行ルート</button>
  </div>

  <div id="mapWrap">
    <svg id="map" viewBox="0 0 1700 1300" preserveAspectRatio="xMidYMid meet">
      <defs>
        <clipPath id="swissClip" clipPathUnits="userSpaceOnUse"></clipPath>
      </defs>
      <image id="baseMap" x="0" y="0" width="1700" height="1300" preserveAspectRatio="none" aria-hidden="true" clip-path="url(#swissClip)"></image>
      <g id="geoLayer" clip-path="url(#swissClip)"></g>
      <!-- 国境線は背景より前、路線・駅名より後ろに描画する -->
      <path id="swissBorder"></path>
      <g id="lineLayer"></g>
      <g id="routeLayer"></g>
      <g id="stationLayer"></g>
      <g id="labelLayer"></g>
      <g id="touristLayer"></g>
      <g id="highlightLayer"></g>
    </svg>

    <details id="layerToggle" class="floating-panel" open>
      <summary>表示レイヤー</summary>
      <div id="layerRows"></div>
    </details>

    <details id="legend" class="floating-panel" open>
      <summary>凡例</summary>
      <div id="legendRows"></div>
    </details>

    <div id="zoomCtrl">
      <button id="zoomIn" aria-label="拡大">＋</button>
      <button id="zoomOut" aria-label="縮小">－</button>
    </div>

    <div id="infoPanel" class="floating-panel">
      <button id="closeInfo">✕</button>
      <h3 id="infoLocal"></h3>
      <div class="ja-name" id="infoJa"></div>
      <div class="info-row"><span class="info-label">地域: </span><span id="infoRegion"></span></div>
      <div class="info-row"><span class="info-label">駅種別: </span><span id="infoType"></span></div>
      <div class="info-row"><span class="info-label">接続路線:</span>
        <div class="lines-list" id="infoLines"></div>
      </div>
      <div class="info-row"><span class="info-label">標高: </span><span id="infoElevation">—</span></div>
      <div class="info-row"><span class="info-label">この駅から行きやすい駅:</span>
        <div class="station-link-list" id="infoConnections"></div>
      </div>
      <div class="info-row"><span class="info-label">周辺の観光地:</span>
        <div class="station-link-list" id="infoTourists"></div>
      </div>
      <div class="station-actions">
        <button class="primary" id="btnAddRoute">＋ 旅行ルートに追加</button>
      </div>
      <div class="btn-row">
        <button class="primary" id="btnFocus">この駅へ移動</button>
        <button id="btnZoomAround">周辺を拡大</button>
      </div>
    </div>

    <div id="routePanel" class="floating-panel">
      <h3>🧳 旅行ルート</h3>
      <div class="route-sub">駅を追加すると、順番に地図上でつなぎます。時刻表ではなく、登録済み路線上の経路を表示します。</div>
      <div id="routeList"></div>
      <div id="routeSummary"></div>
      <div class="route-actions">
        <button class="primary" id="btnRouteFit">ルート全体を表示</button>
        <button id="btnRouteClear">クリア</button>
        <button id="btnRouteClose">閉じる</button>
      </div>
    </div>
    <div id="toast"></div>
  </div>
</div>

<script>
/* =========================================================================
   データ定義
   注: 主要駅・主要路線を中心に、山岳鉄道・私鉄・S-Bahn・観光路線を
   できる限り広く収録した「厳選データセット」です（スイス全駅の完全収録では
   ありません）。座標は概略値です。ご利用前に SBB 公式サイト等で最新情報を
   ご確認ください。
   ========================================================================= */

// 地理座標を1つの座標系で統一。路線・駅・背景地図・国境を同じ緯度経度から描画します。
const MAP_BOUNDS = {minLng:5.75,maxLng:10.65,minLat:45.72,maxLat:47.82};
const PROJ = {
  lng0:MAP_BOUNDS.minLng,
  lat0:MAP_BOUNDS.maxLat,
  latRef:(MAP_BOUNDS.minLat+MAP_BOUNDS.maxLat)/2,
  scale:0, ox:0, oy:0
};
PROJ.scale = 1700 / ((MAP_BOUNDS.maxLng-PROJ.lng0) * Math.cos(PROJ.latRef*Math.PI/180));
function project(lat,lng){
  const cosLat = Math.cos(PROJ.latRef*Math.PI/180);
  return {
    x:(lng-MAP_BOUNDS.minLng)*PROJ.scale*cosLat,
    y:(MAP_BOUNDS.maxLat-lat)*PROJ.scale
  };
}

/* ===== swisstopo 2026 national boundary + background map =====
   swissBOUNDARIES3D is the official national-boundary dataset maintained by swisstopo.
   The browser retrieves the current Switzerland polygon and uses it as the exact SVG clip. */
const baseMap = document.getElementById('baseMap');
const swissClip = document.getElementById('swissClip');
const swissBorder = document.getElementById('swissBorder');
function loadSwissBaseMap(){
  const bbox = `${MAP_BOUNDS.minLng},${MAP_BOUNDS.minLat},${MAP_BOUNDS.maxLng},${MAP_BOUNDS.maxLat}`;
  const url = 'https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=ch.swisstopo.pixelkarte-farbe&STYLES=default&SRS=EPSG:4326&BBOX='+encodeURIComponent(bbox)+'&WIDTH=850&HEIGHT=650&FORMAT=image/png&TRANSPARENT=false';
  baseMap.setAttribute('href',url);
  baseMap.setAttributeNS('http://www.w3.org/1999/xlink','href',url);
}
function geometryToPath(geometry){
  if(!geometry) return '';
  const ringPath = ring => ring.map((p,i)=>{ const q=project(p[1],p[0]); return `${i?'L':'M'}${q.x.toFixed(2)},${q.y.toFixed(2)}`; }).join(' ')+' Z';
  if(geometry.type==='Polygon') return geometry.coordinates.map(ringPath).join(' ');
  if(geometry.type==='MultiPolygon') return geometry.coordinates.flat().map(ringPath).join(' ');
  return '';
}
async function loadOfficialSwissBoundary(){
  const bbox = `${MAP_BOUNDS.minLng},${MAP_BOUNDS.minLat},${MAP_BOUNDS.maxLng},${MAP_BOUNDS.maxLat}`;
  const params = new URLSearchParams({
    geometryType:'esriGeometryEnvelope', geometry:bbox, geometryFormat:'geojson',
    imageDisplay:'1700,1300,96', mapExtent:bbox, tolerance:'0',
    layers:'all:ch.swisstopo.swissboundaries3d-land-flaeche.fill',
    returnGeometry:'true', sr:'4326', lang:'en'
  });
  const res = await fetch('https://api3.geo.admin.ch/rest/services/ech/MapServer/identify?'+params.toString(), {mode:'cors'});
  if(!res.ok) throw new Error('boundary request failed');
  const data = await res.json();
  const feature = (data.results||[]).find(x => x.attributes?.id==='CH' || x.properties?.id==='CH' || /Schweiz|Switzerland|Suisse|Svizzera/i.test(x.attributes?.bez||x.properties?.bez||''));
  if(!feature || !feature.geometry) throw new Error('Switzerland polygon not found');
  const d=geometryToPath(feature.geometry);
  if(!d) throw new Error('empty Switzerland polygon');
  swissClip.innerHTML='';
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  swissClip.appendChild(p);
  swissBorder.setAttribute('d',d);
}
loadSwissBaseMap();
loadOfficialSwissBoundary().catch(err=>{
  console.warn('Official Swiss boundary could not be loaded:',err);
  // Do not substitute an inaccurate hand-drawn border. Keep the map usable and visibly report the issue.
  swissClip.innerHTML='';
  document.getElementById('mapStatus')?.replaceChildren(document.createTextNode('国境データ取得失敗'));
});

const REGIONS = [
  {id:"all",       name:"全体",                 box:[0,0,1700,1300]},
  {id:"zurich",     name:"チューリッヒ・北東部",  box:[940,20,720,540]},
  {id:"basel",      name:"バーゼル・北西部",      box:[580,20,580,420]},
  {id:"bern",       name:"ベルン・中央部",        box:[240,220,680,460]},
  {id:"luzern",     name:"ルツェルン・中央スイス", box:[640,260,540,460]},

/* ---- カメラ（viewBox）状態 ---- */
let camera = {x:0,y:0,w:1700,h:1300};
const WORLD = {minW:80, maxW:2800};

function clampCamera(){
  camera.w = Math.max(WORLD.minW, Math.min(WORLD.maxW, camera.w));
  camera.h = camera.w * (1300/1700);
}
function setViewBox(){
  svg.setAttribute('viewBox', `${camera.x} ${camera.y} ${camera.w} ${camera.h}`);
}
function applyViewBox(){
  setViewBox();
  updateLabelVisibility();
}
function tweenCamera(target, duration=550){
  cancelInertia();
  const start = {...camera};
  const t0 = performance.now();
  function step(now){
    const t = Math.min(1,(now-t0)/duration);
    const e = 1-Math.pow(1-t,3); // ease-out cubic
    camera.x = start.x + (target.x-start.x)*e;
    camera.y = start.y + (target.y-start.y)*e;
    camera.w = start.w + (target.w-start.w)*e;
    camera.h = start.h + (target.h-start.h)*e;
    applyViewBox();
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ---- 路線描画 ---- */
LINES.forEach(line=>{
  const pathPts = line.stations.map(id=>stationsById[id]).filter(Boolean);
  if(pathPts.length<2) return;
  const d = pathPts.map((s,i)=> (i===0?'M':'L')+s.x+','+s.y).join(' ');

  // 0) 白/背景色のケーシング（縁取り）— 背景や他の要素と重なっても線の存在がわかるように
  const casing = document.createElementNS('http://www.w3.org/2000/svg','path');
  casing.setAttribute('d',d);
  casing.setAttribute('class','track-casing');
  const casingW = line.type==='mainline' ? 9 : (line.rack ? 9.2 : 8);
  casing.style.strokeWidth = casingW;
  casing.dataset.lineId = line.id;
  casing.dataset.type = line.type;
  casing.dataset.rack = line.rack? "1":"0";
  casing.dataset.isCasing = "1";
  lineLayer.appendChild(casing);

  // 1) 種別ごとに模様（実線/破線/ドット/一点鎖線）が異なる本体の線
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);
  path.setAttribute('class', 'track '+line.type+(line.rack?' rack':''));
  path.dataset.lineId = line.id;
  path.dataset.type = line.type;
  path.dataset.rack = line.rack? "1":"0";
  path.dataset.scenic = line.scenic? "1":"0";
  lineLayer.appendChild(path);

  // 2) ラック式（登山鉄道）は、黒×白の交互ティックで「ラック軌条」を表現（日本の路線図のJR線のような視認性）
  if(line.rack){
    const tickA = document.createElementNS('http://www.w3.org/2000/svg','path');
    tickA.setAttribute('d',d); tickA.setAttribute('class','rack-tick tick-a');
    tickA.dataset.lineId = line.id; tickA.dataset.type = line.type; tickA.dataset.rack="1";
    lineLayer.appendChild(tickA);
    const tickB = document.createElementNS('http://www.w3.org/2000/svg','path');
    tickB.setAttribute('d',d); tickB.setAttribute('class','rack-tick tick-b');
    tickB.dataset.lineId = line.id; tickB.dataset.type = line.type; tickB.dataset.rack="1";
    lineLayer.appendChild(tickB);
  }

  // 3) 観光路線（氷河特急・ベルニナ線など）は紫のドット破線を最前面にオーバーレイ
  if(line.scenic){
    const overlay = document.createElementNS('http://www.w3.org/2000/svg','path');
    overlay.setAttribute('d',d);
    overlay.setAttribute('class','track scenic-overlay');
    overlay.dataset.scenic="1";
    overlay.dataset.overlay="1";
    overlay.dataset.lineId = line.id;
    lineLayer.appendChild(overlay);
  }
});

// 3) 候補方向・距離を総当たりし、既存の駅マーカー/確定済みラベルと重ならない
//    位置を優先度順（主要駅 → 山岳駅 → 一般駅）に探索する
const DIRS = [
  {k:'n', ux:0,    uy:-1,   anchor:'middle'},
  {k:'s', ux:0,    uy:1,    anchor:'middle'},
  {k:'e', ux:1,    uy:0,    anchor:'start'},
  {k:'w', ux:-1,   uy:0,    anchor:'end'},
  {k:'ne',ux:0.72, uy:-0.72,anchor:'start'},
  {k:'nw',ux:-0.72,uy:-0.72,anchor:'end'},
  {k:'se',ux:0.72, uy:0.72, anchor:'start'},
  {k:'sw',ux:-0.72,uy:0.72, anchor:'end'},
];
const DIR_ORDER_BASE = ['n','s','e','w','ne','nw','se','sw'];
const RADII = [14,22,32,46,64,86,112,145,185];

function dirOrder(pref){
  const idx = DIR_ORDER_BASE.indexOf(pref);
  if(idx<=0) return DIR_ORDER_BASE;
  return [...DIR_ORDER_BASE.slice(idx), ...DIR_ORDER_BASE.slice(0,idx)];
}
function candidateBox(item, dir, r){
  const cx = item.s.x + dir.ux*r, cy = item.s.y + dir.uy*r;
  let minX,maxX;
  if(dir.anchor==='middle'){ minX=cx-item.w/2; maxX=cx+item.w/2; }
  else if(dir.anchor==='start'){ minX=cx; maxX=cx+item.w; }
  else { minX=cx-item.w; maxX=cx; }
  return {minX, minY:cy-item.h/2, maxX, maxY:cy+item.h/2, cx, cy};
}
function overlapArea(a,b,pad){
  const ox = Math.min(a.maxX+pad,b.maxX)-Math.max(a.minX-pad,b.minX);
  const oy = Math.min(a.maxY+pad,b.maxY)-Math.max(a.minY-pad,b.minY);
  if(ox<=0||oy<=0) return 0;
  return ox*oy;
}

const placedBoxes = [];
STATIONS.forEach(s=>{
  const r = (s.type==='major'?4.2:3)+2.5;
  placedBoxes.push({minX:s.x-r,minY:s.y-r,maxX:s.x+r,maxY:s.y+r});
});

const PRIORITY = {major:0, mountain:1, minor:2};
const orderedItems = [...labelItems].sort((a,b)=>PRIORITY[a.s.type]-PRIORITY[b.s.type]);

orderedItems.forEach(item=>{
  const order = dirOrder(item.s.labelDir||'n');
  let best=null, bestScore=Infinity;
  outer:
  for(const r of RADII){
    for(const key of order){
      const dir = DIRS.find(d=>d.k===key);
      const box = candidateBox(item, dir, r);
      let score=0;
      for(const p of placedBoxes){ score += overlapArea(box,p,3); }
      if(score===0){ best={box,dir,r}; bestScore=0; break outer; }
      if(score<bestScore){ bestScore=score; best={box,dir,r}; }
    }
  }
  placedBoxes.push(best.box);
  item.finalBox = best.box; item.dir = best.dir; item.r = best.r;
});

// 4) 確定した位置へテキストと引き出し線を反映
labelItems.forEach(item=>{
  const box = item.finalBox, anchor = item.dir.anchor;
  const tx = anchor==='middle' ? box.cx : (anchor==='start' ? box.minX : box.maxX);
  const cy = (box.minY+box.maxY)/2;
  item.t1.setAttribute('x',tx); item.t1.setAttribute('y',cy-3);
  item.t1.setAttribute('text-anchor',anchor);
  item.t2.setAttribute('x',tx); item.t2.setAttribute('y',cy+10);
  item.t2.setAttribute('text-anchor',anchor);

  if(item.r>18){
    item.leader.setAttribute('x1',item.s.x); item.leader.setAttribute('y1',item.s.y);
    item.leader.setAttribute('x2', item.s.x + item.dir.ux*(item.r-7));
    item.leader.setAttribute('y2', item.s.y + item.dir.uy*(item.r-7));
  } else {
    item.leader.setAttribute('x1',item.s.x); item.leader.setAttribute('y1',item.s.y);
    item.leader.setAttribute('x2',item.s.x); item.leader.setAttribute('y2',item.s.y);
  }
});

/* ---- 検索用インデックス ---- */
function normalize(str){
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[\s\-\/\.,]/g,'');
}
STATIONS.forEach(s=>{
  s._normLocal = normalize(s.name);
  s._normJa = normalize(s.ja);
});
function searchStations(query){
  const q = normalize(query);
  if(!q) return [];
  const starts=[], contains=[];
  STATIONS.forEach(s=>{
    const inLocal = s._normLocal.includes(q);
    const inJa = s._normJa.includes(q);
    if(!inLocal && !inJa) return;
    const startsMatch = s._normLocal.startsWith(q) || s._normJa.startsWith(q);
    (startsMatch?starts:contains).push(s);
  });
  return [...starts, ...contains.filter(s=>!starts.includes(s))].slice(0,10);
}

const routePanel=document.getElementById('routePanel');
const routeListEl=document.getElementById('routeList');
const routeSummaryEl=document.getElementById('routeSummary');
let travelRoute=[];

function addRouteStation(id){
  if(!stationsById[id]) return;
  if(travelRoute.includes(id)){ showToast('この駅はすでにルートに入っています'); return; }
  travelRoute.push(id);
  renderRoute();
  routePanel.classList.add('show');
}
function removeRouteStation(id){
  travelRoute=travelRoute.filter(x=>x!==id); renderRoute();
}
function renderRoute(){
  routeListEl.innerHTML='';
  if(!travelRoute.length){ routeListEl.innerHTML='<div class="route-sub">駅情報から「＋ 旅行ルートに追加」で駅を登録してください。</div>'; routeSummaryEl.textContent=''; routeLayer.innerHTML=''; return; }
  travelRoute.forEach((id,i)=>{
    const s=stationsById[id];
    const row=document.createElement('div'); row.className='route-item';
    row.innerHTML=`<span class="route-num">${i+1}</span><div class="route-name"><div class="route-local">${escapeHtml(s.name)}</div><div class="route-ja">${escapeHtml(s.ja)} · ${stationElevation(id)}</div></div>`;
    const rm=document.createElement('button'); rm.className='route-remove'; rm.textContent='✕'; rm.title='削除'; rm.addEventListener('click',()=>removeRouteStation(id)); row.appendChild(rm);
    routeListEl.appendChild(row);
  });
  const elevs=travelRoute.map(id=>STATION_ELEVATION[id]).filter(Number.isFinite);
  const maxElev=elevs.length?Math.max(...elevs):null;
  const minElev=elevs.length?Math.min(...elevs):null;
  routeSummaryEl.textContent=`${travelRoute.length}駅を登録`+(maxElev!==null?` · 登録駅の標高範囲 ${minElev.toLocaleString('ja-JP')}–${maxElev.toLocaleString('ja-JP')} m`:'');
  drawTravelRoute();
}
function findStationPath(startId,endId){
  if(startId===endId) return [startId];
  const queue=[startId], prev={[startId]:null};
  while(queue.length){
    const cur=queue.shift();
    for(const next of (neighborsById[cur]||[])){
      if(Object.prototype.hasOwnProperty.call(prev,next)) continue;
      prev[next]=cur;
      if(next===endId){
        const path=[]; let x=endId;
        while(x!==null){path.push(x);x=prev[x];}
        return path.reverse();
      }
      queue.push(next);
    }
  }
  return [];
}
function drawTravelRoute(){
  routeLayer.innerHTML='';
  if(travelRoute.length<2) return;
  const full=[];
  for(let i=0;i<travelRoute.length-1;i++){
    const seg=findStationPath(travelRoute[i],travelRoute[i+1]);
    if(!seg.length) continue;
    if(i===0) full.push(...seg); else full.push(...seg.slice(1));
  }
  if(full.length<2) return;
  const d=full.map((id,i)=>{const s=stationsById[id];return `${i?'L':'M'}${s.x},${s.y}`;}).join(' ');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d); path.setAttribute('class','route-path'); routeLayer.appendChild(path);
  travelRoute.forEach(id=>{
    const s=stationsById[id]; const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',s.x); c.setAttribute('cy',s.y); c.setAttribute('r',6); c.setAttribute('class','route-node'); routeLayer.appendChild(c);
  });
}
function fitTravelRoute(){
  const pts=travelRoute.map(id=>stationsById[id]).filter(Boolean);
  if(!pts.length) return;
  const minX=Math.min(...pts.map(s=>s.x)), maxX=Math.max(...pts.map(s=>s.x));
  const minY=Math.min(...pts.map(s=>s.y)), maxY=Math.max(...pts.map(s=>s.y));
  const pad=90;
  const w=Math.max(180,Math.min(WORLD.maxW,(maxX-minX)+pad*2));
  const h=w*(1300/1700);
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  tweenCamera({x:cx-w/2,y:cy-h/2,w,h});
  travelRoute.forEach(id=>highlightStation(stationsById[id]));
}

function screenToUser(clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const px = (clientX-rect.left)/rect.width;
  const py = (clientY-rect.top)/rect.height;
  return { x: camera.x + px*camera.w, y: camera.y + py*camera.h, px, py };
}
function zoomAt(clientX, clientY, factor){
  cancelInertia();
  const before = screenToUser(clientX, clientY);
  let newW = camera.w * factor;
  newW = Math.max(WORLD.minW, Math.min(WORLD.maxW, newW));
  const newH = newW * (1300/1700);
  camera.x = before.x - before.px*newW;
  camera.y = before.y - before.py*newH;
  camera.w = newW; camera.h = newH;
  applyViewBox();
}
svg.addEventListener('wheel',(e)=>{
  e.preventDefault();
  const factor = e.deltaY>0 ? 1.15 : 1/1.15;
  zoomAt(e.clientX, e.clientY, factor);
},{passive:false});

/* ---- パン処理: rAFでイベントをまとめて適用し、離した後は慣性で滑らせる ---- */
let panRAF = null, pendingDx = 0, pendingDy = 0;
function schedulePan(dx, dy){
  pendingDx += dx; pendingDy += dy;
  if(panRAF) return;
  panRAF = requestAnimationFrame(()=>{
    camera.x -= pendingDx; camera.y -= pendingDy;
    pendingDx = 0; pendingDy = 0;
    setViewBox(); // パン中はラベル表示判定を再計算しない（引っかかり防止）
    panRAF = null;
  });
}
let velSamples = [];
function recordVelocitySample(dx, dy){
  const t = performance.now();
  velSamples.push({t,dx,dy});
  const cutoff = t - 120;
  while(velSamples.length && velSamples[0].t < cutoff) velSamples.shift();
}
let inertiaRAF = null;
function cancelInertia(){
  if(inertiaRAF){ cancelAnimationFrame(inertiaRAF); inertiaRAF=null; }
}
function startInertia(vx, vy){
  cancelInertia();
  let last = performance.now();
  const DECAY_PER_SEC = 0.05; // 1秒でおよそ5%まで減速
  function frame(now){
    const dt = Math.min(now-last, 48); last = now;
    camera.x -= vx*dt; camera.y -= vy*dt;
    setViewBox();
    const decay = Math.pow(DECAY_PER_SEC, dt/1000);
    vx *= decay; vy *= decay;
    if(Math.hypot(vx,vy)*1000 > 8){
      inertiaRAF = requestAnimationFrame(frame);
    } else {
      inertiaRAF = null;
      updateLabelVisibility();
    }
  }
  inertiaRAF = requestAnimationFrame(frame);
}
function releaseWithInertia(){
  const now = performance.now();
  if(velSamples.length===0){ updateLabelVisibility(); return; }
  const span = Math.max(now - velSamples[0].t, 1);
  const sumDx = velSamples.reduce((a,s)=>a+s.dx,0);
  const sumDy = velSamples.reduce((a,s)=>a+s.dy,0);
  velSamples = [];
  let vx = sumDx/span, vy = sumDy/span; // world units / ms
  const speed = Math.hypot(vx,vy);
  if(speed*1000 < 25){ updateLabelVisibility(); return; } // 遅すぎる場合は慣性なし
  const maxSpeed = 3.5; // 暴走防止の上限
  if(speed > maxSpeed){ const k = maxSpeed/speed; vx*=k; vy*=k; }
  startInertia(vx, vy);
}

let dragging=false, lastX=0, lastY=0;
svg.addEventListener('mousedown',(e)=>{
  dragging=true; lastX=e.clientX; lastY=e.clientY;
  svg.classList.add('dragging');
  cancelInertia(); velSamples=[];
});
window.addEventListener('mousemove',(e)=>{
  if(!dragging) return;
  const rect = svg.getBoundingClientRect();
  const dx = (e.clientX-lastX)/rect.width*camera.w;
  const dy = (e.clientY-lastY)/rect.height*camera.h;
  lastX=e.clientX; lastY=e.clientY;
  schedulePan(dx,dy);
  recordVelocitySample(dx,dy);
});
window.addEventListener('mouseup',()=>{
  if(!dragging) return;
  dragging=false; svg.classList.remove('dragging');
  releaseWithInertia();
});

/* touch: pan + pinch */
let touchState=null;
svg.addEventListener('touchstart',(e)=>{
  cancelInertia();
  if(e.touches.length===1){
    touchState = {mode:'pan', x:e.touches[0].clientX, y:e.touches[0].clientY};
    velSamples=[];
  } else if(e.touches.length===2){
    const [a,b] = e.touches;
    touchState = {
      mode:'pinch',
      dist: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
      midX:(a.clientX+b.clientX)/2, midY:(a.clientY+b.clientY)/2,
      camW: camera.w
    };
  }
},{passive:true});
svg.addEventListener('touchmove',(e)=>{
  if(!touchState) return;
  if(touchState.mode==='pan' && e.touches.length===1){
    const rect = svg.getBoundingClientRect();
    const t = e.touches[0];
    const dx = (t.clientX-touchState.x)/rect.width*camera.w;
    const dy = (t.clientY-touchState.y)/rect.height*camera.h;
    touchState.x = t.clientX; touchState.y = t.clientY;
    schedulePan(dx,dy);
    recordVelocitySample(dx,dy);
  } else if(touchState.mode==='pinch' && e.touches.length===2){
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const factor = touchState.dist/Math.max(dist,1);
    const midX=(a.clientX+b.clientX)/2, midY=(a.clientY+b.clientY)/2;
    zoomAt(midX, midY, factor);
    touchState.dist = dist;
  }
  e.preventDefault();
},{passive:false});
svg.addEventListener('touchend',()=>{
  const wasPan = touchState && touchState.mode==='pan';
  touchState=null;
  if(wasPan) releaseWithInertia();
  else updateLabelVisibility();
});

/* ---- 初期化 ---- */
renderRoute();
clampCamera();
applyViewBox();
</script>
</body>
</html>
